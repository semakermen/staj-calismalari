<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Hanife Sema Kermen</title>
</head>
<body>
  <header>
    <h1>Hanife Sema Kermen</h1>
    <nav>
      <a href="#hakkimda">Hakkımda</a>
      <a href="#hedeflerim">Hedeflerim</a>
      <a href="#iletisim">İletişim</a>
    </nav>
  </header>

  <main>
    <section id="hakkimda">
      <h2>Hakkımda</h2>
      <p>Ben Hanife Sema Kermen, lise son sınıf öğrencisiyim.</p>
            <img src="image.webp" alt="Kedi" width="300">
    </section>

    <section id="hedeflerim">
      <h2>Hedeflerim</h2>
      <ul>
        <li>İstediğim bölümü kazanmak.</li>
        <li>İşlerimde başarılı olmak.</li>
      </ul>
    </section>

    <section id="iletisim">
      <h2>İletişim</h2>
      <form>
        <p>
          <label for="ad">Adınız</label><br>
          <input type="text" id="ad" name="ad" required>
        </p>
        <p>
          <label for="eposta">E-posta</label><br>
          <input type="email" id="eposta" name="eposta" required>
        </p>
        <p>
          <label for="mesaj">Mesajınız</label><br>
          <textarea id="mesaj" name="mesaj" rows="4"></textarea>
        </p>
        <button type="submit">Gönder</button>
      </form>
    </section>
  </main>

  <footer>
    <p>TurkTicaret.Net staj programı, 2026</p>
  </footer>
</body>
</html>
